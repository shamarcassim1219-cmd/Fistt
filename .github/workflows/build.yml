name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Restore Firebase google-services.json
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: echo "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Restore debug keystore (fixed SHA-1 for Firebase/Google Sign-In)
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Create key.properties pointing to debug keystore
        run: |
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=%s/.android/debug.keystore\n' "$HOME" > android/key.properties

      - name: Print debug keystore SHA-1
        run: keytool -list -v -alias androiddebugkey -keystore ~/.android/debug.keystore -storepass android -keypass android | grep "SHA1:"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Get version for release tag
        id: appver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: v${{ steps.appver.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK and version info for web download
        run: |
          mkdir -p deploy_apk
          cp build/app/outputs/flutter-apk/app-release.apk deploy_apk/app-release.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          cat > deploy_apk/version.json << JSONEOF
          {
            "version": "$VERSION",
            "downloadUrl": "https://buysellgame.store/downloads/app-release.apk",
            "releaseNotes": "New update v$VERSION"
          }
          JSONEOF

      - name: Deploy APK to cPanel downloads folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy_apk/
          server-dir: ./downloads/
