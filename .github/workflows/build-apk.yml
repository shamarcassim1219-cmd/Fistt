name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name mygame_app --org com.mygame.app .

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: echo "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Validate google-services.json
        run: python3 -c "import json; json.load(open('android/app/google-services.json'))"

      - name: Fix applicationId
        run: |
          sed -i 's/applicationId = "com.mygame.app.mygame_app"/applicationId = "com.mygame.app"/' android/app/build.gradle
          sed -i 's/applicationId "com.mygame.app.mygame_app"/applicationId "com.mygame.app"/' android/app/build.gradle

      - name: Bump minSdkVersion to 23
        run: sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle

      - name: Bump compileSdk to 36
        run: sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle

      - name: Bump Kotlin plugin version
        run: sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]*(")/\11.9.24\2/' android/settings.gradle

      - name: Add Firebase Google Services plugin settings
        run: sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle

      - name: Add Firebase Google Services plugin app
        run: sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Ensure INTERNET permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$MANIFEST"

      - name: Add FCM default notification icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "com.google.firebase.messaging.default_notification_icon" "$MANIFEST" || sed -i '/<\/application>/i\        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" \/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@android:color/white" \/>' "$MANIFEST"

      - name: Ensure biometric permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.USE_BIOMETRIC" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>' "$MANIFEST"
          grep -q "android.permission.USE_FINGERPRINT" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>' "$MANIFEST"

      - name: Ensure install-packages permission (for in-app update installer)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>' "$MANIFEST"

      - name: Add queries block for url_launcher (browser/download intents)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "<queries>" "$MANIFEST" || sed -i '/<\/manifest>/i\    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="https" \/>\n        <\/intent>\n    <\/queries>' "$MANIFEST"

      - name: Switch MainActivity to FlutterFragmentActivity for biometric prompt support
        run: |
          KOTLIN_FILE=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          if [ -n "$KOTLIN_FILE" ]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$KOTLIN_FILE"
            sed -i 's/class MainActivity: FlutterActivity/class MainActivity: FlutterFragmentActivity/' "$KOTLIN_FILE"
            sed -i 's/class MainActivity : FlutterActivity/class MainActivity : FlutterFragmentActivity/' "$KOTLIN_FILE"
          fi

      - name: Create missing asset folders
        run: |
          mkdir -p assets/images
          mkdir -p assets/lang
          touch assets/images/.gitkeep
          touch assets/lang/.gitkeep

      - name: Restore debug keystore (fixed SHA-1 for Firebase)
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Print SHA-1 fingerprint for Firebase
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygame-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK and version info for web download
        run: |
          mkdir -p deploy_apk
          cp build/app/outputs/flutter-apk/app-release.apk deploy_apk/app-release.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          cat > deploy_apk/version.json << JSONEOF
          {
            "version": "$VERSION",
            "downloadUrl": "https://buysellgame.store/downloads/app-release.apk",
            "releaseNotes": "New update v$VERSION"
          }
          JSONEOF

      - name: Deploy APK to cPanel downloads folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy_apk/
          server-dir: ./downloads/
