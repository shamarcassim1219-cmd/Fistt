- name: Restore Firebase config
        run: |
          echo "${{ secrets.FIREBASE_ANDROID_CONFIG }}" | base64 --decode > android/app/google-services.json

      - name: Validate google-services.json
        run: |
          if ! python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "ERROR: google-services.json is not valid JSON."
            exit 1
          fi

      - name: Add Firebase Google Services plugin (settings.gradle)
        run: |
          sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle

      - name: Add Firebase Google Services plugin (app/build.gradle)
        run: |
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
