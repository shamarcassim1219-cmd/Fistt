name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders (android/ios etc.)
        run: flutter create --platforms=android --project-name mygame_app --org com.mygame.app .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix applicationId to match Firebase (com.mygame.app)
        run: |
          sed -i 's/applicationId = "com.mygame.app.mygame_app"/applicationId = "com.mygame.app"/' android/app/build.gradle
          sed -i 's/applicationId "com.mygame.app.mygame_app"/applicationId "com.mygame.app"/' android/app/build.gradle

      - name: Ensure INTERNET permission in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
          fi
          echo "----- AndroidManifest.xml permissions -----"
          grep "uses-permission" "$MANIFEST" || echo "No permissions found!"

      - name: Create missing asset folders
        run: |
          mkdir -p assets/images
          mkdir -p assets/lang
          touch assets/images/.gitkeep
          touch assets/lang/.gitkeep

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygame-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
