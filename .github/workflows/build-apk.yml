name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders (android/ios etc.)
        run: flutter create --platforms=android --project-name mygame_app --org com.mygame.app .

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase config
        run: |
          echo "${{ secrets.FIREBASE_ANDROID_CONFIG }}" | base64 --decode > android/app/google-services.json

      - name: Validate google-services.json
        run: |
          if ! python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "ERROR: google-services.json is not valid JSON. Check the FIREBASE_ANDROID_CONFIG secret."
            cat android/app/google-services.json
            exit 1
          fi
          echo "google-services.json is valid JSON."

      - name: Add Firebase Google Services plugin (settings.gradle)
        run: |
          sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle

      - name: Bump Kotlin plugin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: Add Firebase Google Services plugin (app/build.gradle)
        run: |
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Bump compileSdk to 35
        run: |
          sed -i 's/flutter.compileSdkVersion/35/' android/app/build.gradle

      - name: Create missing asset folders
        run: |
          mkdir -p assets/images
          mkdir -p assets/lang
          touch assets/images/.gitkeep
          touch assets/lang/.gitkeep

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygame-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
