name: mygame_app
description: MYGame Marketplace - Buy & Sell Game Accounts Safely
publish_to: 'none'
version: 1.0.14+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  local_auth: ^2.1.7
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  url_launcher: ^6.2.5
  device_info_plus: ^10.1.2
  intl: ^0.19.0
  http: ^1.2.2
  package_info_plus: ^8.0.0
  flutter_windowmanager_plus: ^1.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4+4
  google_sign_in_platform_interface: ^2.5.0
  dio: ^5.4.0
  path_provider: ^2.1.1
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lang/
