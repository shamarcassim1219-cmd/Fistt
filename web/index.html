<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYGame Marketplace</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app">
  <aside class="sidebar"><div class="brand"><div class="brand-icon">🎮</div><div><b>MYGame</b><span>Marketplace</span></div></div>
    <nav id="nav"><button data-page="home" class="active">⌂ <span>Home</span></button><button data-page="listings">◈ <span>Listings</span></button><button data-page="favorites">♡ <span>Favorites</span></button><button data-page="wallet">◉ <span>Wallet</span></button><button data-page="orders">▣ <span>Orders</span></button><button data-page="tournaments">🏆 <span>Tournaments</span></button><button data-page="notifications">♢ <span>Notifications</span></button><button data-page="profile">● <span>Profile</span></button></nav>
    <div class="sidebar-bottom"><button data-page="settings">⚙ <span>Settings</span></button><button id="logoutBtn">⇥ <span>Log out</span></button></div>

  <main><header><button id="mobileMenu" class="icon-btn">☰</button><div><h1 id="pageTitle">Home</h1><p id="pageSub">Buy & sell game accounts safely</p></div><div class="header-actions"><button class="icon-btn" data-page="notifications">♢<i id="badge"></i></button><button class="avatar" id="avatarBtn">U</button></div></header><section id="content"></section></main>
</div>
